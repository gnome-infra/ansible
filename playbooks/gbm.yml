---
- hosts: gbm
  gather_facts: true
  remote_user: root
  pre_tasks:
    # rsyslog_remote_target is hetzner-3's tailscale address, needed even with --limit
    - name: gather hetzner-3 facts
      ansible.builtin.setup:
      delegate_to: hetzner-3
      delegate_facts: true
      run_once: true
  roles:
   - external_base
   - base_auth
   - bash
   - motd
   - rsyslog
   - sshguard
   - podman_rootless
   - statsd_exporter
   - traefik
   - gbm_cache
