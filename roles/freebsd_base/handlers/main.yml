---
- name: Reload pf
  ansible.builtin.command: pfctl -f /etc/pf.conf
  changed_when: true

- name: Restart sshguard
  ansible.builtin.service:
    name: sshguard
    state: restarted

- name: Restart ntpd
  ansible.builtin.service:
    name: ntpd
    state: restarted

- name: Restart syslogd
  ansible.builtin.service:
    name: syslogd
    state: restarted
