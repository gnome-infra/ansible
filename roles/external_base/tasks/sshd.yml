---
# Older sshd_config files (EL8) don't read sshd_config.d; make sure ours is
# read first, before any setting in sshd_config itself.
- name: Read sshd_config.d drop-ins
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: Include /etc/ssh/sshd_config.d/*.conf
    insertbefore: BOF
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Create sshd_config.d
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Harden sshd
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: "{{ external_base_sshd_dropin }}"
    owner: root
    group: root
    mode: '0600'
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
